name: Export IMPERIUM Godot Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android SDK paths and debug signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$JAVA_HOME/bin/java"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Import project resources
        run: godot --headless --editor --path godot --quit
      - name: Export Android debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/godot/build"
          godot --headless --verbose --path godot --export-debug "Android" "$GITHUB_WORKSPACE/godot/build/imperium-debug.apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: imperium-godot-android-debug
          path: godot/build/imperium-debug.apk
          if-no-files-found: error
