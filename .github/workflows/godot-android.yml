name: Export IMPERIUM Godot Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import project resources
        run: godot --headless --editor --path godot --quit
      - name: Export Android debug APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-debug "Android" godot/build/imperium-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: imperium-godot-android-debug
          path: godot/build/imperium-debug.apk
          if-no-files-found: error
